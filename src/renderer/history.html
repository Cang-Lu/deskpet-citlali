<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>茜特菈莉 · 对话记录</title>
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body class="history">
    <header>
      <div>
        <h1>对话记录</h1>
        <p id="summary">—</p>
      </div>
      <div class="header-actions">
        <button id="refresh" type="button" class="ghost">刷新</button>
        <button id="clear" type="button" class="ghost danger">清空</button>
      </div>
    </header>

    <main id="log" class="log"></main>

    <footer>
      <span id="status" class="muted">记录保存在本地，仅包含和她聊天的内容。</span>
      <button id="close" type="button">关闭</button>
    </footer>

    <script type="module" src="history.js"></script>
  </body>
</html>
